<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random User Generator</title>

    <link rel="stylesheet" href="Project13.css">

</head>

<body>

    <h1>🧑 Random User Generator</h1>

    <hr>

    <button id="generateUserBtn">
        Generate New User 🎲
    </button>

    <hr>

    <h2>User Profile</h2>

    <div id="userCard">

    <img
        id="profileImage"
        src=""
        alt="Profile Picture"
    >

        <div class="user-info">

            <p>
                <strong>Full Name :</strong>
                <span id="fullName">-</span>
            </p>

            <p>
                <strong>Age :</strong>
                <span id="age">-</span>
            </p>

            <p>
                <strong>Gender :</strong>
                <span id="gender">-</span>
            </p>

            <p>
                <strong>Email :</strong>
                <span id="email">-</span>
            </p>

            <p>
                <strong>Phone :</strong>
                <span id="phone">-</span>
            </p>

            <p>
                <strong>Country :</strong>
                <span id="country">-</span>
            </p>

        </div>

    </div>

    <script src="Project13.js"></script>

</body>
</html>
